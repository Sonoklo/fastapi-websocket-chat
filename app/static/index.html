<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>WebSocket чат</title>
		<style>
			:root {
				--bg: #0f1115;
				--panel: #171a21;
				--line: #262b36;
				--text: #e6e9ef;
				--muted: #8b93a7;
				--accent: #4f8cff;
				--error: #ff6b6b;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--bg);
				color: var(--text);
				font:
					15px/1.5 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}
			.app {
				width: min(860px, 100%);
				height: min(680px, 100vh);
				display: flex;
				flex-direction: column;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 12px;
				overflow: hidden;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 12px 16px;
				border-bottom: 1px solid var(--line);
			}
			header h1 {
				font-size: 15px;
				margin: 0;
				font-weight: 600;
			}
			.status {
				font-size: 12px;
				padding: 3px 9px;
				border-radius: 20px;
				margin-left: auto;
			}
			.status.online {
				background: #16351f;
				color: #6ee787;
			}
			.status.connecting {
				background: #3a2f14;
				color: #e3b341;
			}
			.status.offline {
				background: #3a1a1a;
				color: var(--error);
			}
			.roster {
				font-size: 12px;
				color: var(--muted);
				padding: 8px 16px;
				border-bottom: 1px solid var(--line);
			}
			#log {
				flex: 1;
				overflow-y: auto;
				padding: 16px;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.msg-head {
				font-size: 12px;
				color: var(--muted);
				margin-bottom: 2px;
			}
			.msg-body {
				white-space: pre-wrap;
				word-break: break-word;
			}
			.system {
				font-size: 12px;
				color: var(--muted);
				text-align: center;
				font-style: italic;
			}
			.system.error {
				color: var(--error);
				font-style: normal;
			}
			#typing {
				height: 18px;
				padding: 0 16px;
				font-size: 12px;
				color: var(--muted);
			}
			form {
				display: flex;
				gap: 8px;
				padding: 12px 16px;
				border-top: 1px solid var(--line);
			}
			input {
				flex: 1;
				padding: 10px 12px;
				border-radius: 8px;
				border: 1px solid var(--line);
				background: #0f1218;
				color: var(--text);
				font: inherit;
				min-width: 0;
			}
			input:focus {
				outline: none;
				border-color: var(--accent);
			}
			button {
				padding: 10px 18px;
				border: 0;
				border-radius: 8px;
				background: var(--accent);
				color: #fff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:hover {
				filter: brightness(1.1);
			}
		</style>
	</head>
	<body>
		<div class="app">
			<header>
				<h1>Комната: <span id="room-name">—</span></h1>
				<span id="status" class="status offline">не подключено</span>
			</header>

			<div class="roster">
				Участники (<span id="user-count">0</span>):
				<span id="users">—</span>
			</div>

			<div id="log"></div>
			<div id="typing"></div>

			<!-- Форма входа: показана до подключения -->
			<form id="login-form">
				<input
					id="username"
					placeholder="Ваше имя"
					maxlength="32"
					required
					autocomplete="off"
				/>
				<input
					id="room"
					placeholder="Комната (general)"
					maxlength="32"
					autocomplete="off"
				/>
				<button type="submit">Войти</button>
			</form>

			<!-- Форма отправки: скрыта, пока нет соединения -->
			<form id="composer" hidden>
				<input
					id="text"
					placeholder="Сообщение…"
					maxlength="2000"
					autocomplete="off"
				/>
				<button type="submit">Отправить</button>
			</form>
		</div>

		<script src="/static/client.js"></script>
	</body>
</html>
